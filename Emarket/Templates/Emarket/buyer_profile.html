<!DOCTYPE html>
<html>
<head>
    <title>Buyer Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff9800 0%, #fff3e0 100%);
            min-height: 100vh;
        }
        .profile-card {
            max-width: 450px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            background: #fff;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -45px;
            border: 4px solid #fff3e0;
            background: #ff9800;
            color: #fff;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="profile-card p-4 text-center">
        <div class="profile-avatar mx-auto mb-3">
            <span>{{ user.first_name|slice:":1"|default:user.username|slice:":1" }}</span>
        </div>
        <h3 class="mb-1">{{ user.first_name }} {{ user.last_name }}</h3>
        <span class="badge bg-success mb-3">Buyer</span>
        <ul class="list-group list-group-flush text-start mb-3">
            <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
            <li class="list-group-item"><strong>Contacts:</strong> {{ profile.phone }}</li>
            <li class="list-group-item"><strong>Address:</strong> {{ profile.address }}</li>
        </ul>
        <a href="{% url 'buyer_edit_profile' %}" class="btn btn-warning w-100 mb-2">Edit Profile</a>
        <a href="{% url 'product_list' %}" class="btn btn-primary w-100">Browse Products</a>
    </div>
</div>
</body>
</html>
