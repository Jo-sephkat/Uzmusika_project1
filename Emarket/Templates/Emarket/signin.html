{% extends 'Emarket/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Sign In</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'signin' %}">  <!-- Fixed: using url tag properly -->
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username or Email:</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password:</label>
                            <input type="password" name="password" class="form-control" required>
                            <small class="text-muted">
                                <a href="{% url 'password_reset' %}">Forgot password?</a>  <!-- Fixed: using url tag -->
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>  <!-- Fixed: using url tag -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
