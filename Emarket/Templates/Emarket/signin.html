{% extends 'Emarket/base.html' %}
{% load static %}

{% block title %}Sign In — UniTrade{% endblock %}

{% block content %}
<section class="sec">
    <div class="wrap" style="max-width: 440px;">
        <div class="panel p-4 p-sm-5 shadow-sm">
            <div class="text-center mb-4">
                <span class="ic d-inline-flex mb-2" style="background: var(--champ); color: var(--ink); width: 48px; height: 48px; font-size: 1.5rem; border-radius: 10px; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-graduation-cap"></i>
                </span>
                <h3 class="fw-bold">Sign in to UniTrade</h3>
                <p class="text-muted small mt-1">Campus student & vendor access</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="post" action="{% url 'signin' %}">
                {% csrf_token %}
                <div class="field mb-3">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="e.g. tendai_moyo" required autofocus>
                </div>

                <div class="field mb-4">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-p w-100 py-2 fw-bold">
                    <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign in
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">
                    New to UniTrade? <a href="{% url 'register' %}" class="fw-bold" style="color: var(--ink);">Create student account</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
