{% extends 'Emarket/base.html' %}
{% load static %}

{% block title %}Feedback — UniTrade{% endblock %}

{% block content %}
<section class="sec">
    <div class="wrap" style="max-width: 540px;">
        <div class="rule"></div>
        <h2 class="mb-3"><i class="fa-solid fa-comments me-2 text-success"></i>Share Your Feedback</h2>
        <p class="text-muted small mb-4">Help us make UniTrade the best campus marketplace in Zimbabwe.</p>

        <div class="panel p-4 p-sm-5 shadow-sm">
            <form method="post" action="{% url 'feedback' %}">
                {% csrf_token %}
                <div class="field mb-4">
                    <label>Your Suggestions or Thoughts</label>
                    <textarea name="feedback" rows="5" placeholder="What features or campus improvements would you like to see?" required></textarea>
                </div>

                <button type="submit" class="btn btn-p w-100 py-2 fw-bold">
                    <i class="fa-solid fa-paper-plane me-1"></i> Submit feedback
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
