{% extends 'Emarket/base.html' %}
{% load static %}

{% block title %}List an Item or Service — UniTrade{% endblock %}

{% block content %}
<section class="sec">
    <div class="wrap" style="max-width: 600px;">
        <div class="rule"></div>
        <h2 class="mb-4"><i class="fa-solid fa-plus-circle me-2 text-success"></i>List an item or service</h2>

        <div class="panel p-4 p-sm-5 shadow-sm">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="field mb-3">
                    <label>Listing Title</label>
                    <input type="text" name="name" placeholder="e.g. Calculus & Linear Algebra Textbook, 3rd edition" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6 field mb-0">
                        <label>Category</label>
                        <select name="category" required>
                            {% for c in categories %}
                                <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-6 field mb-0">
                        <label>Condition</label>
                        <select name="condition" required>
                            {% for cond in conditions %}
                                <option value="{{ cond }}">{{ cond }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6 field mb-0">
                        <label>Price (US$)</label>
                        <input type="number" step="0.01" min="0" name="price" placeholder="10.00" required>
                    </div>
                    <div class="col-6 field mb-0">
                        <label>Campus Location</label>
                        <select name="university" required>
                            {% for u in universities %}
                                <option value="{{ u }}" {% if u == profile.university %}selected{% endif %}>{{ u }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="field mb-3">
                    <label>Description</label>
                    <textarea name="description" rows="4" placeholder="What makes this a good listing? Mention condition, editions, included accessories, or pickup arrangements." required></textarea>
                </div>

                <div class="field mb-4">
                    <label>Photo (Optional)</label>
                    <input type="file" name="image" accept="image/*" class="form-control">
                    <small class="text-muted mt-1 d-block">If no photo is uploaded, a category emoji icon is automatically used.</small>
                </div>

                <button type="submit" class="btn btn-p w-100 py-2 fw-bold">
                    <i class="fa-solid fa-cloud-arrow-up me-1"></i> Publish listing
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
