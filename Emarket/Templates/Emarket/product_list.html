{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    
<div class="container my-5">
    <h2>Products</h2>
    <div class="d-flex justify-content-start mb-4">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back to Home</a>
        <!-- Add this where you want the cart quantity to show, e.g. in the navbar or top of the page -->
        <a href="{% url 'cart' %}" class="btn btn-outline-primary position-relative">
            Cart
            <span id="cart-qty-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                {{ cart_quantity }}
            </span>
        </a>
    </div>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" style="height:200px;object-fit:cover;" alt="{{ product.name }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatewords:15 }}</p>
                    <p class="card-text"><strong>Price:</strong> ${{ product.price }}</p>
                    <!-- Place the form here -->
                    <form method="post" action="{% url 'add_to_cart' product.id %}" class="add-to-cart-form d-flex flex-column align-items-center">
                        {% csrf_token %}
                        <div class="input-group mb-2" style="width: 120px;">
                            <button type="button" class="btn btn-outline-secondary" onclick="var qty = this.parentNode.querySelector('input'); if(qty.value > 1) qty.value--;">-</button>
                            <input type="number" name="quantity" value="1" min="1" class="form-control text-center" style="width: 50px;">
                            <button type="button" class="btn btn-outline-secondary" onclick="var qty = this.parentNode.querySelector('input'); qty.value++;">+</button>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

    <script>
    document.querySelectorAll('.add-to-cart-form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var url = form.action;
            var formData = new FormData(form);
            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Update cart quantity badge
                document.getElementById('cart-qty-badge').textContent = data.cart_quantity;
            });
        });
    });
    </script>

</body>
</html>
