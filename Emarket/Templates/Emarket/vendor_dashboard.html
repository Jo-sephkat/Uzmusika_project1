<!DOCTYPE html>
<html>
<head>
    <title>Vendor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff9800 0%, #fff3e0 100%);
            min-height: 100vh;
        }
        .dashboard-card {
            transition: box-shadow 0.2s;
        }
        .dashboard-card:hover {
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="text-center mb-4">
        <h1>Welcome, {{ profile.user.username }}</h1>
        <span class="badge bg-primary fs-6">Role: {{ profile.role }}</span>
    </div>
    <div class="row justify-content-center g-4">
        <div class="col-md-4">
            <div class="card dashboard-card h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Profile</h5>
                    <p class="card-text">View and edit your profile information.</p>
                    <a href="{% url 'vendor_profile' %}" class="btn btn-outline-primary w-100">Go to Profile</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">My Products</h5>
                    <p class="card-text">Manage your products on offer.</p>
                    <a href="{% url 'vendor_products' %}" class="btn btn-outline-success w-100">View Products</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">Add Product</h5>
                    <p class="card-text">Add a new product to your store.</p>
                    <a href="{% url 'add_product' %}" class="btn btn-outline-warning w-100">Add Product</a>
                </div>
            </div>
        </div>
        <!-- Add more cards as needed -->
    </div>
    <div class="text-center mt-5">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
