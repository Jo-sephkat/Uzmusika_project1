{% extends 'Emarket/base.html' %}
{% load static %}

{% block title %}Edit Listing — UniTrade{% endblock %}

{% block content %}
<section class="sec">
    <div class="wrap" style="max-width: 600px;">
        <div class="rule"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="fa-solid fa-pen-to-square me-2 text-success"></i>Edit Listing</h2>
            <a href="{% url 'vendor_dashboard' %}" class="btn btn-sm btn-o">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="panel p-4 p-sm-5 shadow-sm">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="field mb-3">
                    <label>Listing Title</label>
                    <input type="text" name="name" value="{{ product.name }}" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6 field mb-0">
                        <label>Category</label>
                        <select name="category" required>
                            {% for c in categories %}
                                <option value="{{ c }}" {% if product.category == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-6 field mb-0">
                        <label>Condition</label>
                        <select name="condition" required>
                            {% for cond in conditions %}
                                <option value="{{ cond }}" {% if product.condition == cond %}selected{% endif %}>{{ cond }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6 field mb-0">
                        <label>Price (US$)</label>
                        <input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required>
                    </div>
                    <div class="col-6 field mb-0">
                        <label>Campus Location</label>
                        <select name="university" required>
                            {% for u in universities %}
                                <option value="{{ u }}" {% if product.university == u %}selected{% endif %}>{{ u }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="field mb-3">
                    <label>Description</label>
                    <textarea name="description" rows="4" required>{{ product.description }}</textarea>
                </div>

                <div class="field mb-4">
                    <label>Change Photo (Optional)</label>
                    {% if product.image %}
                        <div class="mb-2">
                            <img src="{{ product.image.url }}" alt="current photo" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px;">
                        </div>
                    {% endif %}
                    <input type="file" name="image" accept="image/*" class="form-control">
                </div>

                <button type="submit" class="btn btn-p w-100 py-2 fw-bold">
                    <i class="fa-solid fa-check me-1"></i> Save changes
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
