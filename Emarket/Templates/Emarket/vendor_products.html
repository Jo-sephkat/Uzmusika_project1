{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.7s forwards;
        }
        .product-card:nth-child(1) { animation-delay: 0.05s; }
        .product-card:nth-child(2) { animation-delay: 0.1s; }
        .product-card:nth-child(3) { animation-delay: 0.15s; }
        .product-card:nth-child(4) { animation-delay: 0.2s; }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
<div class="container my-5">
    <h2>My Products</h2>
    <a href="{% url 'add_product' %}" class="btn btn-success mb-3">Add Product</a>
    <div class="row">
      {% for product in products %}
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
        <div class="card h-100 product-card">
          {% if product.image %}
          <img src="{{ product.image.url }}" class="card-img-top" style="height:200px;object-fit:cover;" alt="{{ product.name }}">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description|truncatewords:15 }}</p>
            <p class="card-text"><strong>Price:</strong> ${{ product.price }}</p>
            <p class="card-text"><strong>Category:</strong> {{ product.category }}</p>
            <a href="{% url 'edit_product' product.pk %}" class="btn btn-primary btn-sm">Edit</a>
            <a href="{% url 'delete_product' product.pk %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
</div>
</body>
</html>
