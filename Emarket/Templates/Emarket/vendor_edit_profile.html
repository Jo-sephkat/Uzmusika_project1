<!DOCTYPE html>
<html>
<head>
    <title>Edit Vendor Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff9800 0%, #fff3e0 100%);
            min-height: 100vh;
        }
        .profile-card {
            max-width: 450px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            background: #fff;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -45px;
            border: 4px solid #fff3e0;
            background: #ff9800;
            color: #fff;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        label {
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="profile-card p-4">
        <div class="profile-avatar mx-auto mb-3 text-center">
            <span>{{ user.first_name|slice:":1"|default:user.username|slice:":1" }}</span>
        </div>
        <h3 class="mb-3 text-center">Edit Profile</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="first_name" class="form-label">First name</label>
                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}">
            </div>
            <div class="mb-3">
                <label for="last_name" class="form-label">Last name</label>
                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Contacts</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.phone }}">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ profile.address }}">
            </div>
            <button type="submit" class="btn btn-warning w-100 mb-2">Save</button>
            <a href="{% url 'vendor_profile' %}" class="btn btn-secondary w-100">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
