{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2>Your Cart</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <!--<tbody>
                {% for item in cart_items %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>${{ item.product.price }}</td>
                    <td>${{ item.total_price }}</td>
                </tr>
                {% endfor %}
            </tbody>-->
            <tbody>
                {% for item in cart_items %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td>
                        <form method="post" action="{% url 'update_cart_item' item.product.id %}" class="d-flex align-items-center">
                            {% csrf_token %}
                            <input type="number" name="quantity" value="{{ item.quantity }}" min="1" class="form-control form-control-sm" style="width: 70px;">
                            <button type="submit" class="btn btn-sm btn-primary ms-2">Update</button>
                        </form>
                    </td>
                    <td>${{ item.product.price }}</td>
                    <td>${{ item.total_price }}</td>
                    <td>
                        <form method="post" action="{% url 'remove_cart_item' item.product.id %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="text-end">
            <h4>Gross Total: ${{ gross_total }}</h4>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'product_list' %}" class="btn btn-primary">Continue Shopping</a>
            <a href="{% url 'make_purchase' %}" class="btn btn-success">Make Purchase</a>
        </div>
    </div>
</body>
</html>
