{% extends 'Emarket/base.html' %}
{% load static %}

{% block title %}Edit Student Profile — UniTrade{% endblock %}

{% block content %}
<section class="sec">
    <div class="wrap" style="max-width: 540px;">
        <div class="rule"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="fa-solid fa-pen-to-square me-2 text-success"></i>Edit Profile</h2>
            <a href="{% url 'buyer_profile' %}" class="btn btn-sm btn-o">
                <i class="fa-solid fa-arrow-left me-1"></i> Profile
            </a>
        </div>

        <div class="panel p-4 p-sm-5 shadow-sm">
            <form method="post">
                {% csrf_token %}
                <div class="row g-2 mb-3">
                    <div class="col-6 field mb-0">
                        <label>First Name</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}">
                    </div>
                    <div class="col-6 field mb-0">
                        <label>Last Name</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}">
                    </div>
                </div>

                <div class="field mb-3">
                    <label>Campus University</label>
                    <select name="university" required>
                        {% for u in universities %}
                            <option value="{{ u }}" {% if profile.university == u %}selected{% endif %}>{{ u }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field mb-3">
                    <label>Student Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required>
                </div>

                <div class="field mb-3">
                    <label>Phone / WhatsApp Contact</label>
                    <input type="text" name="phone" value="{{ profile.phone|default:'' }}">
                </div>

                <div class="field mb-4">
                    <label>Campus Address / Hall of Residence</label>
                    <textarea name="address" rows="3">{{ profile.address|default:'' }}</textarea>
                </div>

                <button type="submit" class="btn btn-p w-100 py-2 fw-bold">
                    <i class="fa-solid fa-check me-1"></i> Save changes
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
